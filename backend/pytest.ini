[pytest]
testpaths = tests seed
pythonpath = .
addopts = -p no:cacheprovider
markers =
    live: calls the real LLM provider (costs money); skipped unless --run-live
    determinism: three live extraction passes over every sample (PRD §16 Day 2 exit condition)
    e2e: browser end-to-end tests (Playwright + Next.js build); skipped unless --run-e2e
